# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, develop]
    tags:
      - "v*.*-*"
  pull_request:
    branches: [main, master, develop]

name: R-CMD-check

permissions:
  contents: write

jobs:
  R-CMD-check:
    if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: true
      matrix:
        config:
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install pngquant (used to compress vignette figures during check)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pngquant
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install pngquant
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install pngquant --no-progress --yes
          fi

      - name: Generate vignette bibliography from canonical inst/REFERENCES.bib
        # CRAN requires the vignette BibTeX file inside the vignette source
        # directory. vignettes/REFERENCES.bib is a derived, git-ignored copy of
        # the canonical inst/REFERENCES.bib (normally produced by the Makefile);
        # regenerate it here since CI does not run make before the check.
        shell: bash
        run: |
          {
            printf '%s\n' \
              '% DO NOT EDIT -- this file is auto-generated from inst/REFERENCES.bib.' \
              '% Edit inst/REFERENCES.bib (the canonical bibliography) instead and run' \
              '% make to regenerate this vignette copy. Any manual changes here will be' \
              '% overwritten by the build.' \
              ''
            cat inst/REFERENCES.bib
          } > vignettes/REFERENCES.bib

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            pandoc \
            pngquant \
            qpdf \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-extra-utils \
            texlive-fonts-extra \
            texlive-plain-generic \
            latexmk \
            texinfo \
            zip

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # spacefillr, qrng, randtoolbox: needed by `make skill-verify`, a prerequisite of r-source-release
          extra-packages: any::rcmdcheck any::devtools any::roxygen2 any::rmarkdown any::knitr any::here any::spacefillr any::qrng any::randtoolbox
          needs: check

      - name: Build release artifacts
        run: make r-source-release

      - name: Zip the agent skill for upload-based installs (e.g. Claude Desktop)
        run: make skill-zip

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/RBesT_*md5
            build/RBesT_*tar.gz
            build/RBesT-v*md5
            build/RBesT-v*tar.gz
            build/rbest-assistant.zip
