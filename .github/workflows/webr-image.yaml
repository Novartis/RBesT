name: webR image

# Build a WebAssembly binary of RBesT together with its dependency closure and
# pack them into a mountable webR library image, then prove the image works by
# running a real gMAP() fit inside webR under Node.
#
# See design/howto-build-rbest-webr.md for the background, the toolchain
# constraint (the webR container is amd64-only, hence GitHub's runners), and
# the troubleshooting notes.
#
# The primary trigger is manual: this repository's CI is GitLab, so this
# workflow is expected to be dispatched by hand after mirroring the branch to
# GitHub. On a published release the same image is additionally attached to
# the release as an asset.

on:
  # TEMPORARY, remove before merging. A `push` trigger runs workflows that are
  # not on the default branch, which `workflow_dispatch` cannot do — see the
  # how-to, section 3.2. It is here so the first wasm builds can be iterated on
  # this branch without repointing anyone's default branch. Both dispatch
  # inputs below have `||` fallbacks, so the defaults apply on a push.
  push:
    branches:
      - issue-webr-gh-action
  workflow_dispatch:
    inputs:
      webr-image:
        description: webR development container image (pin it; `:main` moves)
        default: ghcr.io/r-wasm/webr:v0.6.0
        type: string
      strip:
        description: >-
          Library subdirectories to drop from the image. `include` is
          deliberately absent; see the how-to, section 7.
        default: demo, doc, examples, help, html, tests, vignette
        type: string
  release:
    types: [published]

concurrency:
  group: webr-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WEBR_IMAGE: ${{ inputs.webr-image || 'ghcr.io/r-wasm/webr:v0.6.0' }}
  # The npm `webr` version must match the container image used to build the
  # library, otherwise the image is loaded by a different R.
  WEBR_NPM_VERSION: 0.6.0

jobs:
  build:
    name: Build wasm image
    runs-on: ubuntu-24.04
    # Cross-compiling the closure from source is slow; rstan alone is large.
    timeout-minutes: 300

    steps:
      - name: Checkout RBesT
        uses: actions/checkout@v5

      # The webR development container carries the emscripten toolchain, a wasm
      # R build and `rwasm`. It is amd64-only, which is precisely why this runs
      # on a GitHub runner rather than a developer machine.
      - name: Pull webR container
        run: docker pull "$WEBR_IMAGE"

      # NOTE: `r-wasm/actions/build-rwasm` is deliberately not used here. It
      # calls `rwasm::add_pkg()` with the package defaults, and two of them are
      # wrong for this package: `dependencies = FALSE` would build RBesT alone
      # and yield an image with none of ggplot2/dplyr/posterior in it, and
      # `remotes = NA` resolves rwasm's full `webr-remotes` list, which aborts
      # pkgdepends on refs unrelated to RBesT. tools/webr/build-rwasm.R sets
      # both explicitly; see the comments there.
      - name: Build wasm packages and library image
        run: |
          docker run --rm \
            -v "$PWD":/github/workspace \
            -w /github/workspace \
            -e RBEST_STRIP \
            --entrypoint Rscript \
            "$WEBR_IMAGE" tools/webr/build-rwasm.R
        env:
          RBEST_STRIP: ${{ inputs.strip || 'demo, doc, examples, help, html, tests, vignette' }}

      # The container writes as root.
      - name: Take ownership of build output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" _rwasm || true

      - name: Inspect build output
        run: |
          echo "::group::library image"
          ls -l _rwasm/image
          echo "::endgroup::"
          echo "::group::applied patches"
          cat _rwasm/image/PATCHES.txt
          echo "::endgroup::"
          echo "::group::wasm binaries"
          find _rwasm/repo -name '*.tgz' -printf '%10s  %f\n' | sort -k2
          echo "::endgroup::"

      # The image-wide gate lives in the `verify` job, but by then the compile
      # log is a job away and a broken image has already been uploaded. This is
      # the same check narrowed to the one binary that depends on `configure`
      # having copied inst/webr/tbb-stubs.cpp into the generated src/: if that
      # copy is skipped, RBesT.so builds and installs perfectly well and only
      # fails when webR tries to `dlopen()` it. Catch it here, next to the
      # compile output that explains it.
      - name: Check the RBesT binary carries the TBB stubs
        run: |
          tgz=$(find _rwasm/repo -name 'RBesT_*.tgz' | head -1)
          echo "RBesT wasm binary: ${tgz}"
          tmp=$(mktemp -d)
          tar xzf "$tgz" -C "$tmp"
          node tools/webr/wasm-tbb-symbols.cjs "$tmp/RBesT/libs/RBesT.so"

      # The image that gets verified must provably be the image that gets
      # uploaded and released. The checksums travel inside the artifact and are
      # re-checked in both downstream jobs.
      - name: Checksum the image
        run: |
          cd _rwasm/image
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload library image
        uses: actions/upload-artifact@v6
        with:
          name: rbest-webr-image
          path: _rwasm/image/
          if-no-files-found: error

      # Kept deliberately: this holds the RBesT wasm binary itself, which is
      # what you unpack when the image builds but will not load.
      - name: Upload wasm package repository
        uses: actions/upload-artifact@v6
        with:
          name: rbest-wasm-repo
          path: _rwasm/repo/
          if-no-files-found: error

  verify:
    name: Verify image in webR
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout RBesT
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The whole point of the exercise is that the image loads in *stock*
      # webR: the feasibility work proved the TBB diagnosis by patching
      # `resolveSymbol` in node_modules/webr/dist/R.js, and shipping a patched
      # webR is not an acceptable deliverable (shinylive serves stock webR).
      # So webR is installed into a throwaway directory outside the checkout,
      # where nothing in this repository can reach it, and the installed tree is
      # compared file by file against the published tarball.
      - name: Install a pristine webR
        run: |
          webr_dir="$(mktemp -d)"
          echo "WEBR_DIR=${webr_dir}" >> "$GITHUB_ENV"
          cd "$webr_dir"
          npm install --no-package-lock --no-audit --no-fund "webr@${WEBR_NPM_VERSION}"
          npm pack "webr@${WEBR_NPM_VERSION}" >/dev/null
          tar xzf "webr-${WEBR_NPM_VERSION}.tgz"
          diff -r package/dist node_modules/webr/dist
          echo "webr@${WEBR_NPM_VERSION} matches the published tarball, byte for byte"

      - name: Download library image
        uses: actions/download-artifact@v7
        with:
          name: rbest-webr-image
          path: _rwasm/image

      - name: Check the image is the one that was built
        run: |
          cd _rwasm/image
          sha256sum -c SHA256SUMS
          echo "::group::applied patches"
          cat PATCHES.txt
          echo "::endgroup::"

      # Mechanical, not by eye: nearly every `tbb::` symbol these modules
      # import is a header-defined weak symbol they also export, so only the
      # difference between the import and export sections means anything.
      # Anything left here is a `dlopen()` failure waiting to happen.
      - name: Scan the image for unresolved TBB symbols
        run: |
          metadata=$(ls _rwasm/image/*.js.metadata)
          node tools/webr/wasm-tbb-symbols.cjs "${metadata%.js.metadata}"

      - name: Run a real gMAP fit against the image
        run: |
          metadata=$(ls _rwasm/image/*.js.metadata)
          base="${metadata%.js.metadata}"
          echo "Mounting image base: ${base}"
          NODE_PATH="${WEBR_DIR}/node_modules" \
            WEBR_VFS="${base}" node tools/webr/run-webr-vfs.cjs tools/webr/verify-rbest.R

  release:
    name: Attach image to release
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download library image
        uses: actions/download-artifact@v7
        with:
          name: rbest-webr-image
          path: _rwasm/image

      - name: Check the image is the one that was verified
        run: |
          cd _rwasm/image
          sha256sum -c SHA256SUMS

      - name: Upload image to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: _rwasm/image/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
